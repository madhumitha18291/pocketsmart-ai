<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketSmart AI – Budget & Recommendation Assistant</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-color: #1f2937;
      --muted-text: #6b7280;
      --border-color: #e5e7eb;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 1.875rem;
      color: var(--primary);
    }

    header p {
      color: var(--muted-text);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border-color);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.85rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    .results-header {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .recommendations-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .recommendation-item {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      background-color: #fafafa;
    }

    .item-details h3 {
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
    }

    .item-details p {
      font-size: 0.9rem;
      color: var(--muted-text);
    }

    .item-price {
      font-weight: bold;
      color: var(--accent);
      font-size: 1.1rem;
      white-space: nowrap;
    }

    .placeholder-text {
      text-align: center;
      color: var(--muted-text);
      padding: 2rem 0;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>PocketSmart AI</h1>
      <p>Your Intelligent Budget & Recommendation Assistant</p>
    </header>

    <!-- Input Form Card -->
    <main class="card">
      <form id="recommendation-form">
        <div class="form-group">
          <label for="budget">Total Budget ($)</label>
          <input type="number" id="budget" name="budget" placeholder="e.g. 500" min="1" required>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="" disabled selected>Select a category</option>
            <option value="electronics">Electronics & Gadgets</option>
            <option value="travel">Travel & Vacation</option>
            <option value="lifestyle">Lifestyle & Fashion</option>
            <option value="home">Home & Living</option>
          </select>
        </div>

        <div class="form-group">
          <label for="requirements">Specific Requirements or Preferences</label>
          <textarea id="requirements" name="requirements" rows="3" placeholder="e.g. Need a laptop with good battery life for college and light gaming."></textarea>
        </div>

        <button type="submit" id="submit-btn">Get AI Recommendations</button>
      </form>
    </main>

    <!-- Results Section -->
    <section class="card">
      <div class="results-header">
        <h2>AI Recommendations</h2>
      </div>

      <div id="placeholder" class="placeholder-text">
        Enter your budget and preferences above to view smart recommendations.
      </div>

      <div id="results-list" class="recommendations-list hidden"></div>
    </section>
  </div>

  <script>
    document.getElementById('recommendation-form').addEventListener('submit', async function(event) {
      event.preventDefault();

      const budget = document.getElementById('budget').value;
      const category = document.getElementById('category').value;
      const requirements = document.getElementById('requirements').value;
      
      const submitBtn = document.getElementById('submit-btn');
      const placeholder = document.getElementById('placeholder');
      const resultsList = document.getElementById('results-list');

      // Update UI state for loading
      submitBtn.disabled = true;
      submitBtn.textContent = 'Generating Recommendations...';
      placeholder.textContent = 'Analyzing your budget and requirements...';
      placeholder.classList.remove('hidden');
      resultsList.classList.add('hidden');

      try {
        /* 
           FastAPI Integration Point:
           Replace the URL below with your FastAPI endpoint (e.g., 'http://127.0.0.1:8000/api/recommend')
        */
        const response = await fetch('/api/recommend', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            budget: parseFloat(budget),
            category: category,
            requirements: requirements
          })
        });

        if (!response.ok) {
          throw new Error('Failed to fetch recommendations');
        }

        const data = await response.json();
        renderResults(data.recommendations);

      } catch (error) {
        console.warn('API Endpoint not connected yet. Showing mock demo data:', error);
        
        // Mock data fallback for frontend preview before backend is connected
        setTimeout(() => {
          const mockData = [
            { title: "Option A (Best Value)", description: "Fits your budget while meeting all core features.", price: `$${(budget * 0.75).toFixed(2)}` },
            { title: "Option B (Premium Choice)", description: "Maxes out budget for top-tier performance.", price: `$${budget}` },
            { title: "Option C (Budget Saver)", description: "Saves money while giving you essential functionality.", price: `$${(budget * 0.50).toFixed(2)}` }
          ];
          renderResults(mockData);
        }, 800);

      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Get AI Recommendations';
      }
    });

    function renderResults(items) {
      const placeholder = document.getElementById('placeholder');
      const resultsList = document.getElementById('results-list');

      resultsList.innerHTML = '';

      if (!items || items.length === 0) {
        placeholder.textContent = 'No recommendations found for this budget.';
        placeholder.classList.remove('hidden');
        return;
      }

      placeholder.classList.add('hidden');
      resultsList.classList.remove('hidden');

      items.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = 'recommendation-item';
        itemEl.innerHTML = `
          <div class="item-details">
            <h3>${item.title}</h3>
            <p>${item.description}</p>
          </div>
          <div class="item-price">${item.price}</div>
        `;
        resultsList.appendChild(itemEl);
      });
    }
  </script>
</body>
</html>
