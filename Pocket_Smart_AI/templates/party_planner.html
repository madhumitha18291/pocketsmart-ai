{% extends "base.html" %}

{% block title %}
Party Planner
{% endblock %}


{% block content %}

<div class="planner">

    <div class="pagehead">

        <span class="eyebrow">
            PARTY PLANNER
        </span>

        <h1>
            Plan your event
        </h1>

        <p>
            Allocate your budget across
            food, venue and decoration.
        </p>

    </div>


    <form
        id="partyForm"
        class="form-grid"
    >

        <label>

            Budget (₹)

            <input
                name="budget"
                type="number"
                min="1"
                required
            >

        </label>


        <label>

            Guests

            <input
                name="guests"
                type="number"
                min="1"
                required
            >

        </label>


        <label>

            Event type

            <input
                name="event_type"
                placeholder="Birthday"
                required
            >

        </label>


        <label>

            Venue preference

            <input
                name="venue"
                value="home or affordable hall"
            >

        </label>


        <button class="btn">

            Generate recommendations

        </button>

    </form>


    <div
        id="result"
        class="result hidden"
    ></div>

</div>

{% endblock %}
