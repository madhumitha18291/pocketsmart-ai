<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<nav>

    <a
        class="brand"
        href="/"
    >
        PocketSmart AI
    </a>

    <div class="navlinks">

        <a href="/">
            Home
        </a>

        {% if user %}

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/history">
                History
            </a>

            <button
                class="linkbtn"
                onclick="logout()"
            >
                Logout
            </button>

        {% else %}

            <a href="/login">
                Login
            </a>

            <a
                class="pill"
                href="/register"
            >
                Register
            </a>

        {% endif %}

    </div>

</nav>


<main>

    {% block content %}
    {% endblock %}

</main>


<footer>

    PocketSmart AI
    ·
    Budget-aware recommendations

</footer>


<script
    src="/static/js/app.js"
></script>

</body>

</html>
